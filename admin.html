<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Apostle Priscilla Vargas</title>
    <link href="https://fonts.googleapis.com/css2?family=Ephesis&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Georgia, serif;
            background: #faf6ef;
            color: #3d3428;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        button {
            background: #c9a227;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #a68b1f;
        }

        .status {
            margin-top: 8px;
            font-size: 0.9rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html">Volver al sitio</a>
        <h1>Administración</h1>
        <section class="section" id="login-panel">
            <form id="login-form">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" autocomplete="username" required>
                <label for="password">Contraseña</label>
                <input id="password" type="password" autocomplete="current-password" required>
                <button id="login-button" disabled>Iniciar sesión</button>
            </form>
        </section>
        <section class="section" id="admin-panel" hidden>
            <h2>Acceso autorizado</h2>
            <p>La conexión con Firebase está activa. Los editores de contenido se habilitarán en la siguiente etapa.</p>
            <button type="button" id="logout-button">Cerrar sesión</button>
        </section>
        <p id="auth-status" role="status">Conectando con Firebase…</p>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
        const app = initializeApp({
            apiKey: "AIzaSyBT9XQP1W_agcc6YyVdwSIRwpIKI4oyqaI",
            authDomain: "priscilla-vargas.firebaseapp.com",
            projectId: "priscilla-vargas",
            storageBucket: "priscilla-vargas.firebasestorage.app",
            messagingSenderId: "332544919827",
            appId: "1:332544919827:web:caf0403849b334b39ff2e6"
        });
        const auth = getAuth(app), db = getFirestore(app);
        const $ = id => document.getElementById(id);
        const status = $("auth-status");
        onAuthStateChanged(auth, async user => {
            $("admin-panel").hidden = true;
            $("login-panel").hidden = !!user;
            $("login-button").disabled = true;
            if (!user) {
                $("login-button").disabled = false;
                status.textContent = "";
                return;
            }
            status.textContent = "Verificando permisos…";
            try {
                const admin = await getDoc(doc(db, "admins", user.uid));
                if (!admin.exists() || admin.data().role !== "admin") throw new Error("No autorizado");
                if (auth.currentUser?.uid !== user.uid) return;
                $("admin-panel").hidden = false;
                status.textContent = "Sesión iniciada: " + user.email;
            } catch {
                await signOut(auth);
                status.textContent = "No se pudo verificar el acceso de administrador.";
            }
        });
        $("login-form").addEventListener("submit", async e => {
            e.preventDefault();
            $("login-button").disabled = true;
            try {
                await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
                $("password").value = "";
            } catch {
                status.textContent = "No se pudo iniciar sesión. Verifique sus datos e intente nuevamente.";
                $("login-button").disabled = false;
            }
        });
        $("logout-button").addEventListener("click", () => signOut(auth).catch(() => { status.textContent = "No se pudo cerrar la sesión."; }));
    </script>
</body>

</html>
