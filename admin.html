<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Apostle Priscilla Vargas</title>
    <link href="https://fonts.googleapis.com/css2?family=Ephesis&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Georgia, serif;
            background: #faf6ef;
            color: #3d3428;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        button {
            background: #c9a227;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #a68b1f;
        }

        .status {
            margin-top: 8px;
            font-size: 0.9rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
     #book-form input:not([type=checkbox]), #book-form textarea, #login-form input { display:block; width:100%; max-width:100%; box-sizing:border-box; padding:10px; border:1px solid #d9c9ad; border-radius:6px; margin-bottom:12px; font:inherit; } #book-manager { border-top:1px solid #eadfce; margin-top:20px; padding-top:12px; } [hidden] { display:none !important; }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html">Volver al sitio</a>
        <h1>Administración</h1>
        <section class="section" id="login-panel">
            <form id="login-form">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" autocomplete="username" required>
                <label for="password">Contraseña</label>
                <input id="password" type="password" autocomplete="current-password" required>
                <button id="login-button" disabled>Iniciar sesión</button>
            </form>
        </section>
        <section class="section" id="admin-panel" hidden>
            <h2>Acceso autorizado</h2>
            <p>La conexión con Firebase está activa.</p>
            <button type="button" id="logout-button">Cerrar sesión</button>
            <div id="book-manager"><h2>Libros</h2><button type="button" id="book-import" hidden>Importar libro existente</button><div id="book-list"></div><button type="button" id="book-new">+ Nuevo libro</button><form id="book-form"><label for="book-title">Título</label><input id="book-title" required><label for="book-author">Autor</label><input id="book-author"><label for="book-description">Descripción</label><textarea id="book-description" rows="5"></textarea><label for="book-cover">Portada (URL HTTPS o ruta existente)</label><input id="book-cover"><label for="book-amazonUrl">Enlace de Amazon</label><input id="book-amazonUrl" type="url"><label><input id="book-published" type="checkbox"> Publicado</label><label><input id="book-featured" type="checkbox"> Libro destacado en inicio</label><button type="submit">Guardar libro</button> <button type="button" id="book-delete" hidden>Eliminar libro</button></form><p id="book-status" role="status"></p></div>
        </section>
        <p id="auth-status" role="status">Conectando con Firebase…</p>
    </div>
    <script type="module">
        import { app, db } from "./js/firebase-site.js";
        import { initBooks } from "./js/firestore-books-admin.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
        const auth = getAuth(app);
        const $ = id => document.getElementById(id);
        const status = $("auth-status");
        onAuthStateChanged(auth, async user => {
            $("admin-panel").hidden = true;
            $("book-list").replaceChildren();
            $("book-form").reset();
            $("login-panel").hidden = !!user;
            $("login-button").disabled = true;
            if (!user) {
                $("login-button").disabled = false;
                status.textContent = "";
                return;
            }
            status.textContent = "Verificando permisos…";
            try {
                const admin = await getDoc(doc(db, "admins", user.uid));
                if (!admin.exists() || admin.data().role !== "admin") throw new Error("No autorizado");
                if (auth.currentUser?.uid !== user.uid) return;
                $("admin-panel").hidden = false;
                initBooks();
                status.textContent = "Sesión iniciada: " + user.email;
            } catch {
                await signOut(auth);
                status.textContent = "No se pudo verificar el acceso de administrador.";
            }
        });
        $("login-form").addEventListener("submit", async e => {
            e.preventDefault();
            $("login-button").disabled = true;
            try {
                await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
                $("password").value = "";
            } catch {
                status.textContent = "No se pudo iniciar sesión. Verifique sus datos e intente nuevamente.";
                $("login-button").disabled = false;
            }
        });
        $("logout-button").addEventListener("click", () => signOut(auth).catch(() => { status.textContent = "No se pudo cerrar la sesión."; }));
    </script>
</body>

</html>
