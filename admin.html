<!-- path: admin.html -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Apostle Priscilla Vargas</title>
    <link href="https://fonts.googleapis.com/css2?family=Ephesis&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Georgia, serif;
            background: #faf6ef;
            color: #3d3428;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        button {
            background: #c9a227;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #a68b1f;
        }

        .status {
            margin-top: 8px;
            font-size: 0.9rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
     #book-form input:not([type=checkbox]), #book-form textarea, #home-form input, #home-form textarea, #login-form input { display:block; width:100%; max-width:100%; box-sizing:border-box; padding:10px; border:1px solid #d9c9ad; border-radius:6px; margin-bottom:12px; font:inherit; } #book-manager { border-top:1px solid #eadfce; margin-top:20px; padding-top:12px; } [hidden] { display:none !important; }
    #workspace-back { position:sticky; top:12px; z-index:5; background:#17468c; color:white; margin:0 0 12px; box-shadow:0 2px 8px #0002; font-weight:bold; } #workspace-back:hover { background:#10356c; }
    #workspace-back:disabled { opacity:.5; cursor:wait; }
    </style>
</head>

<body>
    <div class="container">
        <a data-dashboard-only href="index.html">Volver al sitio</a>
        <h1>Administración</h1>
        <section class="section" id="login-panel">
            <form id="login-form">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" autocomplete="username" required>
                <label for="password">Contraseña</label>
                <input id="password" type="password" autocomplete="current-password" required>
                <button id="login-button" disabled>Iniciar sesión</button>
            </form>
        </section>
        <section class="section" id="admin-panel" hidden>
            <button type="button" id="workspace-back" hidden>← Volver al panel</button>
            <h2 data-dashboard-only>Acceso autorizado</h2>
            <p data-dashboard-only>La conexión con Firebase está activa.</p>
            <button type="button" id="logout-button" data-dashboard-only>Cerrar sesión</button>
            <div id="home-manager" data-admin-section="home" style="border-top:1px solid #eadfce;margin-top:20px;padding-top:12px"><h2>Inicio</h2><button type="button" id="home-edit" aria-controls="home-form" aria-expanded="false">Editar inicio</button><form id="home-form" hidden><label for="home-kicker">Subtítulo</label><input id="home-kicker" required>
<label for="home-title">Título principal</label><input id="home-title" required>
<label for="home-introduction">Introducción</label><textarea id="home-introduction" rows="4" required></textarea>
<label for="home-photo">Fotografía (URL o ruta existente)</label><input id="home-photo" required><div id="home-drop" style="border:2px dashed #c9a227;border-radius:8px;padding:16px;margin-bottom:12px;text-align:center"><img id="home-preview" hidden alt="Vista previa de fotografía" style="max-width:100%;max-height:240px;object-fit:contain;display:block;margin:0 auto 12px"><label for="home-file">Seleccionar o arrastrar fotografía</label><input id="home-file" type="file" accept="image/jpeg,image/png,image/webp"><small>JPEG, PNG o WebP · máximo 5 MB · imagen pública al guardar.</small></div>
<label for="home-button">Texto del botón</label><input id="home-button" required>
<label for="home-featuredLabel">Etiqueta del libro destacado</label><input id="home-featuredLabel" required>
<label for="home-featuredButton">Botón del libro destacado</label><input id="home-featuredButton" required>
<label for="home-eventTitle">Título de invitación a eventos</label><input id="home-eventTitle" required>
<label for="home-eventText">Descripción de eventos</label><textarea id="home-eventText" rows="4" required></textarea>
<label for="home-eventButton">Botón de eventos</label><input id="home-eventButton" required><button type="submit" disabled>Guardar y publicar inicio</button> <button type="button" id="home-cancel">Cancelar</button></form><p id="home-status" role="status"></p></div>
            <div id="book-manager" data-admin-section="books"><h2>Libros</h2><button type="button" id="book-import" hidden>Importar libro existente</button><div id="book-list"></div><button type="button" id="book-new">+ Nuevo libro</button><form id="book-form" hidden><h3 id="book-editor-title">Nuevo libro</h3><label for="book-title">Título</label><input id="book-title" required><label for="book-author">Autor</label><input id="book-author"><label for="book-description">Descripción</label><textarea id="book-description" rows="5"></textarea><label for="book-cover">Portada (URL HTTPS o ruta existente)</label><input id="book-cover"><div id="cover-drop" style="border:2px dashed #c9a227;border-radius:8px;padding:16px;margin-bottom:12px;text-align:center"><img id="cover-preview" hidden alt="Vista previa de portada" style="max-width:180px;max-height:240px;object-fit:contain;display:block;margin:0 auto 12px"><label for="cover-file">Seleccionar o arrastrar imagen</label><input id="cover-file" type="file" accept="image/jpeg,image/png,image/webp"><small>JPEG, PNG o WebP · máximo 5 MB. La imagen será pública al guardar.</small></div><label for="book-amazonUrl">Enlace de Amazon</label><input id="book-amazonUrl" type="url"><label><input id="book-published" type="checkbox"> Publicado</label><label><input id="book-featured" type="checkbox"> Libro destacado en inicio</label><button type="submit">Guardar libro</button> <button type="button" id="book-cancel">Cancelar</button> <button type="button" id="book-delete" hidden>Eliminar libro</button></form><p id="book-status" role="status"></p></div>
        </section>
        <p id="auth-status" role="status">Conectando con Firebase…</p>
    </div>
    <script type="module">
        import { app, db } from "./js/firebase-site.js";
        import { openWorkspace, resetWorkspace } from "./js/admin-workspace.js";
        import { initBooks } from "./js/firestore-books-admin.js";
        import { initHomepage, resetHomepage } from "./js/firestore-home-admin.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
        const auth = getAuth(app);
        const $ = id => document.getElementById(id);
        const status = $("auth-status");
        onAuthStateChanged(auth, async user => {
            $("admin-panel").hidden = true;
            resetWorkspace();
            resetHomepage();
            $("book-list").replaceChildren();
            $("book-form").reset();
            $("book-form").hidden = true;
            $("book-list").hidden = false;
            $("book-new").hidden = false;
            $("book-import").hidden = true;
            $("book-status").textContent = "";
            $("cover-preview").hidden = true;
            $("cover-preview").removeAttribute("src");
            $("login-panel").hidden = !!user;
            $("login-button").disabled = true;
            if (!user) {
                $("login-button").disabled = false;
                status.textContent = "";
                return;
            }
            status.textContent = "Verificando permisos…";
            try {
                const admin = await getDoc(doc(db, "admins", user.uid));
                if (!admin.exists() || admin.data().role !== "admin") throw new Error("No autorizado");
                if (auth.currentUser?.uid !== user.uid) return;
                $("admin-panel").hidden = false;
                initBooks();
                $("home-edit").onclick = () => {
                    if (!openWorkspace("home")) return;
                    $("home-form").hidden = false;
                    $("home-edit").hidden = true;
                    $("home-edit").setAttribute("aria-expanded","true");
                    initHomepage();
                };
                status.textContent = "Sesión iniciada: " + user.email;
            } catch {
                await signOut(auth);
                status.textContent = "No se pudo verificar el acceso de administrador.";
            }
        });
        $("login-form").addEventListener("submit", async e => {
            e.preventDefault();
            $("login-button").disabled = true;
            try {
                await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
                $("password").value = "";
            } catch {
                status.textContent = "No se pudo iniciar sesión. Verifique sus datos e intente nuevamente.";
                $("login-button").disabled = false;
            }
        });
        $("logout-button").addEventListener("click", () => signOut(auth).catch(() => { status.textContent = "No se pudo cerrar la sesión."; }));
    </script>
</body>

</html>
