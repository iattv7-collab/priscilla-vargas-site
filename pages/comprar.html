<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprar | Apostle Priscilla Vargas</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <section class="page-hero">
    <div class="container">
      <h1>Ordenar el Libro</h1>
      <p>La Llave del Reino: El Poder de la Gratitud</p>
    </div>
  </section>

  <section class="container" style="padding: 60px 0; text-align: center;">
    <div class="book-card" style="max-width: 400px; margin: 0 auto;">
      <img src="../images/author-with-book.jpg" alt="Libro">
      <h3>La Llave del Reino</h3>
      <p style="font-size: 1.6rem; color: var(--gold-dark); margin: 15px 0;">$19.99 USD</p>
      <p>Envío disponible a nivel nacional e internacional.</p>
      <form style="margin-top: 20px;">
        <div class="form-group">
          <label>Cantidad</label>
          <input type="number" value="1" min="1" style="width: 80px; margin: 0 auto; display: block;">
        </div>
        <button type="button" class="btn-primary" onclick="alert('¡Gracias por tu interés! En un sitio real, aquí se integraría un sistema de pago como Stripe o PayPal.')">Agregar al Carrito</button>
      </form>
    </div>
    <p style="margin-top: 30px;">Para pedidos especiales o mayoreo, contáctanos en contacto@priscillavargas.com</p>
  </section>

  <footer>
    <div class="container footer-inner">
      <div class="footer-logo">👑 Apostle Priscilla Vargas</div>
      <div>✉️ contacto@priscillavargas.com</div>
    </div>
  </footer>

  <script>
    fetch('/partials/header.html')
      .then(r => r.text())
      .then(html => document.body.insertAdjacentHTML('afterbegin', html));
  </script>
</body>
</html>
