<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libros | Apostle Priscilla Vargas</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    .books-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      padding: 40px 0 60px;
    }
    .books-list {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .book-item {
      padding: 16px 18px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }
    .book-item:hover, .book-item.active {
      background: #faf6ef;
    }
    .book-item h4 { margin: 0 0 4px; font-size: 1rem; color: var(--brown); }
    .book-item p { margin: 0; font-size: 0.85rem; color: #888; }
    .book-detail {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .book-detail img {
      width: 100%;
      max-width: 280px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 1rem;
    }
    @media (max-width: 768px) {
      .books-layout { grid-template-columns: 1fr; }
      .books-list { max-height: 300px; overflow-y: auto; }
    }
  </style>
</head>
<body>
  <section class="page-hero">
    <div class="container">
      <h1>Libros</h1>
      <p>Enseñanzas que edifican, sanan y transforman</p>
    </div>
  </section>

  <section class="container">
    <div class="books-layout">
      <div>
        <input type="text" class="search-box" id="search" placeholder="Buscar libros...">
        <div class="books-list" id="books-list"></div>
      </div>
      <div class="book-detail" id="book-detail">
        <p style="color:#888;">Selecciona un libro de la lista</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container footer-inner">
      <div class="footer-logo">👑 Apostle Priscilla Vargas</div>
      <div>✉️ contacto@priscillavargas.com</div>
    </div>
  </footer>

  <script type="module" src="/js/site-header.js"></script>

  <script type="module">
    import { db, amazonURL, coverURL } from "../js/firebase-site.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
    const list = document.getElementById("books-list"), detail = document.getElementById("book-detail");
    let allBooks = [];
    function showBook(book, item) {
      detail.replaceChildren();
      list.querySelectorAll(".book-item").forEach(el=>el.classList.remove("active"));
      item.classList.add("active");
      const cover = coverURL(book.cover);
      if (cover) { const img = document.createElement("img"); img.src=cover; img.alt=book.title; detail.append(img); }
      for (const [tag,value] of [["h2",book.title],["p",book.author],["p",book.description]]) {
        if (!value) continue;
        const el=document.createElement(tag); el.textContent=value; detail.append(el);
      }
      const url=amazonURL(book.amazonUrl);
      if(url) { const a=document.createElement("a"); a.href=url; a.className="btn-primary"; a.style.marginTop="20px"; a.textContent="Comprar en Amazon"; a.target="_blank"; a.rel="noopener noreferrer"; detail.append(a); }
    }
    function render() {
      const q=document.getElementById("search").value.toLowerCase();
      const books=allBooks.filter(b=>[b.title,b.author].some(v=>String(v||"").toLowerCase().includes(q)));
      list.replaceChildren(); detail.textContent="No hay libros disponibles.";
      books.forEach((book,i)=>{
        const item=document.createElement("button"); item.type="button"; item.className="book-item"; item.style.cssText="display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;background-color:transparent;font:inherit;";
        const h=document.createElement("h4"); h.textContent=book.title;
        const p=document.createElement("p"); p.textContent=book.author||"";
        item.append(h,p); item.onclick=()=>showBook(book,item); list.append(item);
        if(i===0)showBook(book,item);
      });
    }
    document.getElementById("search").addEventListener("input",render);
    detail.textContent="Cargando libros…";
    try {
      const snap=await getDocs(query(collection(db,"books"),where("published","==",true)));
      allBooks=snap.docs.map(d=>d.data()).filter(b=>typeof b.title==="string" && b.title.trim());
      render();
    } catch(e) { console.error(e); detail.textContent="No se pudo cargar el catálogo. Intenta nuevamente."; }
  </script>
</body>
</html>
